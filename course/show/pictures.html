<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian · episode walkthroughs</title>
<style>
:root{
  --bg:#151b28; --card:#212a3d; --line:#35425d; --ink:#edf2f9; --mute:#a3b1c7; --faint:#6f7f99;
  --teal:#2dd4bf; --sky:#38bdf8; --amber:#fbbf24; --coral:#ff7a5c; --violet:#a78bfa; --gold:#f5c542;
  --bronze:#d08b4f; --silver:#c3ccd8; --ease:cubic-bezier(.16,.84,.24,1);
  --sans:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:hidden;
  background:radial-gradient(1100px 700px at 12% 8%,#22304a 0%,transparent 62%),radial-gradient(900px 640px at 92% 95%,#2a2647 0%,transparent 60%),linear-gradient(160deg,#182032,#151b28 55%,#171c2c)}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none}
.orb.a{width:520px;height:520px;background:#1f8a9b;left:-140px;top:-160px;animation:drift 22s ease-in-out infinite alternate}
.orb.b{width:600px;height:600px;background:#5b4bb5;right:-200px;bottom:-240px;animation:drift 26s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(120px,80px) scale(1.12)}}
.grid-bg{position:absolute;inset:0;pointer-events:none;opacity:.45;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%)}
#fx{position:absolute;inset:0;pointer-events:none}
#home,#slides{position:absolute;inset:0;z-index:1}
.slide{position:absolute;inset:0;padding:72px 100px 64px;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateX(64px);filter:blur(6px);transition:opacity .7s var(--ease),transform .85s var(--ease),filter .7s var(--ease),visibility 0s .85s}
.slide.active{opacity:1;visibility:visible;transform:none;filter:none;transition:opacity .7s var(--ease),transform .85s var(--ease),filter .7s var(--ease)}
.slide.past{transform:translateX(-64px)}
.in{opacity:1}
.slide.active .in{animation:rise .6s var(--ease) both;animation-delay:calc(var(--d,0)*60ms)}
@keyframes rise{from{transform:translateY(12px)}to{transform:none}}
.f{opacity:0;transform:translateY(18px);filter:blur(4px);transition:opacity .5s var(--ease),transform .7s var(--ease),filter .5s}
.f.on{opacity:1;transform:none;filter:none}
.focus:has(.f.cur) .f.on:not(.cur){opacity:.45}
.kicker{font-size:16px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent,var(--teal));margin-bottom:14px;display:flex;align-items:center;gap:12px}
.kicker::before{content:"";width:30px;height:2px;background:currentColor}
h1{font-size:64px;line-height:1.02;letter-spacing:-.035em;margin:0;font-weight:800}
h2{font-size:52px;line-height:1.05;letter-spacing:-.03em;margin:0 0 8px;font-weight:800}
.lead{font-size:24px;line-height:1.4;color:var(--mute);max-width:1100px;margin:8px 0 0}
.grad{background:linear-gradient(92deg,#7dd3fc,#2dd4bf 50%,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(41,52,75,.92),rgba(33,42,61,.92));border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 50px -24px #000,inset 0 1px 0 rgba(255,255,255,.05);animation:breathe 7s ease-in-out infinite}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.08) 50%,transparent 60%);background-size:220% 100%;animation:sheen 7s ease-in-out infinite;pointer-events:none}
@keyframes breathe{50%{box-shadow:0 26px 60px -22px rgba(45,212,191,.25)}}
@keyframes sheen{0%{background-position:130% 0}100%{background-position:-40% 0}}
.tile{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(160deg,#2c3852,#222b3e);border:1px solid #3a4866;flex:none}
.tile img{width:36px;height:36px}
.mono{font-family:var(--mono)}
#progress{position:absolute;left:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--teal),var(--violet));z-index:5;transition:width .6s var(--ease)}
#count,#brand{position:absolute;bottom:18px;z-index:5;font-size:15px;color:var(--faint);letter-spacing:.08em}
#count{right:28px}#brand{left:32px;text-transform:uppercase;display:flex;gap:10px;align-items:center}
#brand i{width:9px;height:9px;border-radius:3px;background:var(--teal);transform:rotate(45deg);display:block}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:32vh;overflow:auto;padding:16px 26px;background:rgba(10,14,22,.94);border-top:1px solid var(--line);display:none;z-index:20;white-space:pre-wrap;font-size:18px;line-height:1.5}
body.show-notes #notes{display:block}
body.clean #progress,body.clean #count,body.clean #brand{opacity:0}
#portrait{display:none}
@media (max-width:700px) and (orientation:portrait){
  #portrait{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:42px;
    background:radial-gradient(500px 360px at 50% 25%,#22304a 0%,transparent 68%),linear-gradient(160deg,#182032,#151b28 60%,#211d38)}
  #portrait .phone{width:58px;height:94px;border:3px solid var(--teal);border-radius:12px;box-shadow:0 0 28px rgba(45,212,191,.3);transform:rotate(90deg);margin-bottom:42px}
  #portrait h2{width:100%;max-width:260px;font-size:30px;line-height:1.08;margin:0 0 14px;white-space:normal}
  #portrait p{width:100%;max-width:260px;color:var(--mute);font-size:17px;line-height:1.55;margin:0}
}

/* home */
#home{padding:64px 80px;display:flex;flex-direction:column}
#home h1{font-size:54px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:28px}
.pick{padding:16px 16px 14px;text-align:left;color:inherit;cursor:pointer;border-top:4px solid var(--c);display:flex;flex-direction:column;gap:6px;min-height:132px;font:inherit}
.pick b{font-size:18px;line-height:1.25}
.pick em{font-style:normal;font-size:13px;font-weight:800;letter-spacing:.12em;color:var(--c)}
.pick span{margin-top:auto;font-size:13px;color:var(--faint)}
.pick:hover{transform:translateY(-3px)}

/* shared scenes */
.scene{flex:1;margin-top:18px;position:relative}
.sweep{position:absolute;top:0;bottom:0;width:90px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);animation:sweep 5.5s ease-in-out infinite;pointer-events:none;z-index:3}
@keyframes sweep{0%{left:-8%}100%{left:108%}}
.towers,.schemas{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;height:100%}
.tower,.schema{padding:22px 22px 18px;display:flex;flex-direction:column;gap:10px}
.tower h3,.schema h3{margin:0;font-size:22px}
.tag{font-size:12px;font-weight:800;letter-spacing:.16em}
.pill{font-family:var(--mono);font-size:16px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}
.pill.hot{border-color:rgba(45,212,191,.7);box-shadow:0 0 0 1px rgba(45,212,191,.3);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 22px rgba(45,212,191,.35)}}
.bz{color:var(--bronze)} .sv{color:var(--silver)} .gd{color:var(--gold)}
.starscape{width:920px;height:500px;margin:0 auto;position:relative}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:230px;padding:26px 18px;text-align:center;z-index:2}
.core b{font-size:22px;display:block}
.core span,.moon span{color:var(--mute);font-size:14px}
.moon{position:absolute;transform:translate(-50%,-50%);padding:14px 16px;text-align:center;min-width:150px;z-index:2}
.moon b{display:block;font-size:16px}
.spinner{position:absolute;left:50%;top:50%;width:0;height:0;animation:spin 9s linear infinite}
.comet{position:absolute;left:-9px;top:-214px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 18px 8px rgba(167,139,250,.75)}
@keyframes spin{to{transform:rotate(360deg)}}
.halo{position:absolute;left:50%;top:50%;width:428px;height:428px;margin:-214px 0 0 -214px;border-radius:50%;border:1.5px dashed rgba(167,139,250,.45);animation:spin 48s linear infinite}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:28px;height:100%}
.room{padding:36px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.room h3{margin:0;font-size:36px}
.room p{margin:0;font-size:22px;color:var(--mute);line-height:1.4}
.badge{align-self:flex-start;font-weight:800;letter-spacing:.14em;font-size:14px;padding:8px 14px;border-radius:999px}
.badge.on,.badge.off{position:absolute;left:0;top:0}
.badge.on{background:rgba(74,222,128,.15);color:#4ade80;animation:swap 4.8s steps(1) infinite}
.badge.off{background:rgba(251,191,36,.12);color:var(--amber);animation:swap 4.8s steps(1) infinite;animation-delay:-2.4s}
@keyframes swap{0%,49%{opacity:1}50%,100%{opacity:0}}
.track{position:relative;height:100%;padding:28px 36px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.band{position:relative;display:grid;gap:16px;padding-top:28px}
.trow{display:grid;grid-template-columns:90px 1fr 140px;gap:16px;align-items:center;font-family:var(--mono);font-size:18px}
.rail{position:relative;height:14px;border-radius:7px;background:rgba(255,255,255,.05)}
.rail i{position:absolute;top:0;bottom:0;left:0;width:56%;border-radius:7px;background:linear-gradient(90deg,#334155,#38bdf8)}
.rail i.new{left:66%;width:30%;background:linear-gradient(90deg,#fbbf24,#fb7185)}
.flag{position:absolute;top:0;bottom:0;left:61%;width:3px;background:var(--teal);box-shadow:0 0 16px var(--teal);animation:flag 5s ease-in-out infinite}
.flag b{position:absolute;top:-6px;left:10px;white-space:nowrap;font-family:var(--sans);color:var(--teal);font-size:16px}
@keyframes flag{50%{left:64%}}
.copies{display:grid;gap:14px;margin-top:8px}
.copy{padding:16px 20px;font-family:var(--mono);font-size:18px;display:flex;justify-content:space-between;align-items:center}
.copy em{font-style:normal;color:var(--faint);font-size:14px}
.copy.keep{border-color:rgba(45,212,191,.8)}
.copy.keep em{color:var(--teal)}
.ring{width:18px;height:18px;border-radius:50%;border:3px solid var(--teal);box-shadow:0 0 0 0 rgba(45,212,191,.6);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 12px transparent}}
.cascade{display:grid;gap:12px}
.step{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;padding:14px 18px}
.step .n{font-size:22px;font-weight:800;color:var(--faint)}
.light{position:absolute;left:0;right:0;height:64px;background:linear-gradient(transparent,rgba(45,212,191,.18),transparent);animation:down 4.5s linear infinite;pointer-events:none}
@keyframes down{0%{top:-10%}100%{top:100%}}
.clockwrap{display:grid;grid-template-columns:420px 1fr;gap:40px;align-items:center;height:100%}
.clock{width:380px;height:380px;border-radius:50%;margin:0 auto;border:1px solid var(--line);position:relative;background:radial-gradient(circle at 50% 50%,#243049,#1a2233)}
.hand{position:absolute;left:50%;top:50%;width:4px;height:140px;margin-left:-2px;background:linear-gradient(var(--teal),transparent);transform-origin:top center;animation:spin 12s linear infinite}
.tick{position:absolute;left:50%;top:18px;width:3px;height:14px;background:var(--mute);transform-origin:center 172px}
.jobs{display:grid;gap:14px}
.job{padding:16px 18px;display:flex;gap:14px;align-items:center;font-size:20px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:24px;height:100%}
.side{padding:28px;display:flex;flex-direction:column;gap:18px}
.side h3{margin:0;font-size:28px}
.meter{height:22px;border-radius:11px;background:rgba(255,255,255,.06);overflow:hidden}
.meter b{display:block;height:100%;border-radius:11px;width:var(--w)}
.bad b{background:linear-gradient(90deg,#fbbf24,#fb7185);animation:load 3s ease-in-out infinite}
.good b{background:linear-gradient(90deg,#2dd4bf,#38bdf8);width:18%}
@keyframes load{50%{width:96%} }
.lights{display:grid;grid-template-columns:1fr 1fr;gap:18px;height:100%}
.lightcard{padding:26px;display:flex;gap:16px;align-items:flex-start}
.dot{width:16px;height:16px;border-radius:50%;background:#4ade80;box-shadow:0 0 12px #4ade80;margin-top:6px;flex:none;animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.gauge{width:520px;margin:10px auto 0;text-align:center;position:relative}
.dial{width:460px;height:250px;margin:0 auto;border-radius:230px 230px 0 0;border:18px solid #2a354c;border-bottom:0;position:relative;background:conic-gradient(from 270deg at 50% 100%,#fb7185 0 16%,#fbbf24 16% 21%,#4ade80 21% 50%,transparent 50%);-webkit-mask:radial-gradient(circle at 50% 100%,transparent 58%,#000 59%);mask:radial-gradient(circle at 50% 100%,transparent 58%,#000 59%)}
.needle{position:absolute;left:50%;bottom:48px;width:6px;height:150px;margin-left:-3px;background:#fff;border-radius:4px;transform-origin:bottom center;animation:needle 5.5s ease-in-out infinite}
@keyframes needle{0%,100%{transform:rotate(-58deg)}50%{transform:rotate(18deg)}}
.gate{position:absolute;left:50%;bottom:48px;width:3px;height:168px;background:var(--amber);transform-origin:bottom center;transform:rotate(-18deg)}
.g-label{margin-top:18px;font-size:20px;color:var(--mute)}
.seq{display:flex;align-items:center;gap:8px;height:100%}
.seq .box{flex:1;padding:22px 12px;text-align:center;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.seq .box b{font-size:18px}
.seq .arr{color:var(--faint);font-size:22px}
.token{position:absolute;bottom:22px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 16px 6px rgba(45,212,191,.7);animation:token 6s linear infinite}
@keyframes token{0%{left:4%}100%{left:92%}}
.owners{display:grid;grid-template-columns:1fr 80px 1fr;gap:18px;align-items:center;height:100%}
.owner{padding:32px;min-height:280px}
.owner h3{margin:8px 0;font-size:32px}
.lock{font-size:42px;text-align:center;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){
  .slide,.f{transition:none!important}
  .slide.active .in,.orb,.card::after,.needle,.token,.lock{animation:none!important}
}
.pitch{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:30px}
.p4{padding:28px 20px;min-height:280px;border-top:4px solid var(--c)}
.p4 em{font-style:normal;letter-spacing:.16em;font-size:13px;font-weight:800;color:var(--c)}
.p4 b{display:block;font-size:28px;margin:12px 0}
.p4 p{color:var(--mute);font-size:18px;line-height:1.4}
.timer{width:120px;height:120px;border-radius:50%;margin-left:auto;display:grid;place-items:center;font-size:28px;font-weight:800;background:conic-gradient(var(--teal) var(--p),#2a354c 0);position:relative}
.timer::after{content:"";position:absolute;inset:10px;border-radius:50%;background:#1b2436}
.timer span{position:relative;z-index:1}
.beats{display:grid;gap:14px;margin-top:26px}
.beat{display:grid;grid-template-columns:56px 1fr;gap:16px;align-items:center;padding:16px 20px}
.beat .n{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(45,212,191,.12);color:var(--teal);font-weight:800;font-size:20px}
.beat b{font-size:22px} .beat p{margin:2px 0 0;color:var(--mute);font-size:18px}
.handoff{margin-top:auto;display:flex;gap:22px;align-items:center;padding:26px 28px}
.handoff em{font-style:normal;letter-spacing:.18em;font-size:13px;font-weight:800;color:var(--amber)}
.handoff h3{margin:4px 0;font-size:32px}
.handoff code{font-family:var(--mono);font-size:18px;color:var(--teal)}
.handoff .handwhere{font-size:18px;margin-top:6px}
#help{position:fixed;right:16px;top:14px;font-size:13px;color:var(--faint);background:rgba(10,14,22,.75);border:1px solid var(--line);border-radius:10px;padding:10px 14px;line-height:1.7;opacity:0;z-index:20}
#help a{color:var(--teal)}
body.show-help #help{opacity:1}
</style>
</head>
<body>
<div id="portrait"><div class="phone" aria-hidden="true"></div><h2>Turn your phone sideways</h2><p>This is a 16:9 presentation. Landscape keeps every word large, aligned and easy to read.</p></div>
<div id="stage">
  <div class="orb a"></div><div class="orb b"></div><div class="grid-bg"></div>
  <canvas id="fx" width="1600" height="900"></canvas>
  <div id="home"></div>
  <div id="slides"></div>
  <div id="brand"><i></i>Meridian · walkthrough before the demo</div>
  <div id="count"></div>
  <div id="progress"></div>
</div>
<div id="notes"></div>
<div id="help">→ next · ← back · Esc episodes · F fullscreen · N notes · C hide chrome · H help<br><a href="../show.html">On-camera screen</a></div>
<script>
const LOGO = {
  pg:'<img src="../course_assets/logos/postgresql.svg" alt="">',
  py:'<img src="../course_assets/logos/python.svg" alt="">',
  sf:'<img src="../course_assets/logos/snowflake.svg" alt="">',
  dbt:'<img src="../course_assets/logos/dbt.svg" alt="">',
  af:'<img src="../course_assets/logos/apacheairflow.svg" alt="">',
  st:'<img src="../course_assets/logos/streamlit.svg" alt="">',
  dk:'<img src="../course_assets/logos/docker.svg" alt="">',
  gh:'<img src="../course_assets/logos/githubactions.svg" alt="">',
  pq:'<img src="../course_assets/logos/apacheparquet.svg" alt="">'
};
const pill = (t, hot) => `<div class="pill${hot ? " hot" : ""}">${t}</div>`;
const beat = (n, t, d) => `<div class="beat card f"><div class="n">${n}</div><div><b>${t}</b><p>${d}</p></div></div>`;
const hand = (logo, where, title, cmd) => `<div class="card handoff f"><div class="tile">${logo}</div><div><h3>${title}</h3><code>${cmd}</code><p class="lead handwhere">${where}</p></div></div>`;

const EP = [
{id:"e0", code:"E0", color:"#2dd4bf", title:"The problem, then the picture", mins:"45 min",
 slides:[
  {notes:"Open on the promise, not the tools. 'Fresh, correct, historical, private and affordable. Every technical choice in this project must protect one of these five words.'",
   html:`<div class="kicker in">Episode 0 · before any tool</div><h2 class="in">Five promises define <span class="grad">done</span></h2><p class="lead in">A pipeline that merely moves rows is not finished.</p>
   <div class="scene"><div class="lights">
     ${[["Fresh","At most 15 minutes behind the bank"],["Correct","Warehouse totals equal the source"],["Historical","A customer's past survives change"],["Private","Each person sees only their rows"],["Affordable","Small warehouses pause after 60 seconds"],["Explainable","Every design decision has a reason"]].map((x,i)=>`<div class="card lightcard"><i class="dot" style="animation-delay:-${i*.35}s"></i><div><b>${x[0]}</b><p class="lead" style="font-size:16px">${x[1]}</p></div></div>`).join("")}
   </div></div>`},
  {notes:"One click per room. Keep returning to the analogy during the course: till, courier, inbox, kitchen, shelf, front desk. Airflow is the alarm clock over all of them.",
   html:`<div class="kicker">The whole system</div><h2>Six rooms and <span class="grad">one alarm clock</span></h2><div class="beats focus">
     ${beat(1,"Till · PostgreSQL","The live bank. It takes payments; analytics never writes back.")}
     ${beat(2,"Courier · Python","Copies only what changed and packs it as Parquet.")}
     ${beat(3,"Inbox · Snowflake RAW","Append-only bronze: every copy the courier delivered.")}
     ${beat(4,"Kitchen · dbt","Silver cleans and joins. Gold becomes facts and dimensions.")}
     ${beat(5,"Front desk · Streamlit + Cortex","English becomes SQL; Snowflake decides which rows return.")}
     ${beat(6,"Alarm clock · Airflow","Runs the same commands on time, retries and alerts.")}
   </div>`},
  {notes:"Read each card as technology, language, screen, output. SQL and Python are languages; DBeaver, Cursor and Snowsight are places where we work; Parquet is a file.",
   html:`<div class="kicker">The stack without the jargon</div><h2>What we type, <span class="grad">where we type it</span>, what comes out</h2>
   <div class="lights">
     ${[
       ["PostgreSQL","SQL · DBeaver","bank rows"],
       ["Python","Python · Cursor + Terminal","Parquet files"],
       ["Snowflake","SQL · Snowsight","raw and governed tables"],
       ["dbt","SQL + Jinja · Cursor","tested facts and dimensions"],
       ["Airflow","Python · Cursor + Airflow UI","scheduled runs and alerts"],
       ["Streamlit","Python · Cursor / Snowflake","a governed data app"],
       ["Terraform","HCL · Cursor + Terminal","roles and warehouses"],
       ["GitHub Actions","YAML · GitHub","automatic checks"]
     ].map((x,i)=>`<div class="card lightcard"><i class="dot" style="animation-delay:-${i*.3}s"></i><div><b>${x[0]}</b><p class="lead" style="font-size:15px;margin:.2em 0">${x[1]}</p><span class="pill">${x[2]}</span></div></div>`).join("")}
   </div>`},
  {notes:"The technical slides now define grain, physical locations and the design we rejected. This is where the detailed course begins.",
   html:`<div class="kicker">Then the technical lesson</div><h2>First, learn to say <span class="grad">what one row means</span></h2>
   ${hand(LOGO.sf,"Technical slides · architecture before commands","the Episode 0 lesson","grain · physical location · design decisions")}`}
]},
{id:"e2", code:"E2", color:"#a78bfa", title:"Draw the warehouse first", mins:"45 min",
 slides:[
  {notes:"'We do not open Snowflake yet. One row in the middle is one payment. Everything around it describes that payment.' Let the dot travel.",
   html:`<div class="kicker in">Episode 2 · on paper, before Snowflake</div><h2 class="in">Facts in the middle. <span class="grad">Descriptions around them.</span></h2>
   <div class="scene"><div class="starscape">
     <div class="halo"></div><div class="spinner"><div class="comet"></div></div>
     <div class="card core"><b>fct_transactions</b><span>one payment · its amount</span></div>
     <div class="card moon" style="left:50%;top:6%"><b>dim_date</b><span>when</span></div>
     <div class="card moon" style="left:86%;top:28%"><b>dim_customer</b><span>who · which version</span></div>
     <div class="card moon" style="left:86%;top:72%"><b>dim_account</b><span>which account</span></div>
     <div class="card moon" style="left:50%;top:94%"><b>dim_branch</b><span>where</span></div>
     <div class="card moon" style="left:14%;top:72%"><b>dim_channel</b><span>how</span></div>
     <div class="card moon" style="left:14%;top:28%"><b>dim_product</b><span>what</span></div>
   </div></div>`},
  {notes:"Four clicks. Grain, versions, fan-out, the rate on the day. 'Join on customer_id alone and one payment becomes two.'",
   html:`<div class="kicker">Say these out loud</div><h2>Four answers <span class="grad">before any SQL</span></h2><div class="beats focus">
     ${beat(1,"What is one row?","fct_transactions: one payment, newest status. If you cannot say it, the table will double-count.")}
     ${beat(2,"A customer has versions","A March payment stays MASS after the August upgrade. Each version has a time window.")}
     ${beat(3,"Forget the window and rows double","Join on customer_id alone matches every version. That bug is called fan-out.")}
     ${beat(4,"Convert money on the day it moved","Keep rupees, dollars, and that day's rate. Today's rate must not rewrite history.")}
   </div>`},
  {notes:"Stay here. Next episode is Snowflake. 'The drawing is the spec.'",
   html:`<div class="kicker">Then</div><h2>The drawing is the spec. <span class="grad">Snowflake is next.</span></h2><p class="lead">Three fact shapes to name if asked: a receipt (one payment), a photograph (a balance at month end), a story (a loan from submitted to decided).</p>`}
]},
{id:"e3", code:"E3", color:"#22d3ee", title:"Snowflake: rooms, keys, shelves", mins:"40 min",
 slides:[
  {notes:"Point at storage: 'the data stays when I switch the computer off.' Click nothing yet; let the badge flip between ON and PAUSED.",
   html:`<div class="kicker in">Episode 3 · before Snowsight</div><h2 class="in">Storage stays. <span class="grad">Compute is rented by the second.</span></h2>
   <div class="scene"><div class="rooms">
     <div class="card room"><div class="tile">${LOGO.sf}</div><h3>Storage</h3><p>Databases, schemas, the raw tables. Still there when every warehouse is suspended.</p><div class="badge on">ALWAYS HERE</div></div>
     <div class="card room" style="position:relative"><div class="tile">${LOGO.sf}</div><h3>A warehouse</h3><p>Just a computer. WH_INGEST_XS and WH_TRANSFORM_XS pause after 60 seconds. You pay for them only while they run.</p><div style="position:relative;height:36px"><div class="badge on">RUNNING</div><div class="badge off">PAUSED</div></div></div>
   </div></div>`},
  {notes:"Roles, then the key, then the empty bronze tables. 'Nobody gets permissions directly. People and robots get roles.'",
   html:`<div class="kicker">What we will create</div><h2>Rooms, locks, <span class="grad">empty shelves</span></h2><div class="beats focus">
     ${beat(1,"Roles, not personal grants","Loader, transformer, analyst, the app. A person is granted a role.")}
     ${beat(2,"Robots log in with a key","The public key is the lock on the Snowflake user. The private key never leaves the laptop.")}
     ${beat(3,"Two databases","MERIDIAN_RAW for bronze. MERIDIAN_ANALYTICS for everything dbt builds.")}
     ${beat(4,"A raw table is four columns","record, _extracted_at, _batch_id, _source_file. Empty until Python arrives.")}
   </div>`},
  {notes:"ACCOUNTADMIN for script 01 only. Then we drop back down.",
   html:`<div class="kicker">Hands on</div><h2>Script 01, as <span class="grad">ACCOUNTADMIN</span></h2>
   ${hand(LOGO.sf,"Snowsight · then 02_databases and 03_stages","Snowsight","03_snowflake/01_account_setup_rbac.sql")}`}
]},
{id:"py0", code:"P0", color:"#facc15", title:"Python foundations for this pipeline", mins:"35 min",
 slides:[

     <div class="card room"><div class="tile">${LOGO.py}</div><h3>Local Python 3.12</h3><p>Cursor writes the file. Terminal runs it. The virtual environment holds this project's libraries.</p><div class="badge on">REAL PROJECT</div></div>

     ${beat(1,"Values and decisions","print · variables · types · int/float · if/elif/else")}
     ${beat(2,"Repeat and reuse","for · while · functions · return · main")}
     ${beat(3,"Keep small collections","lists · dictionaries · rows · settings")}
     ${beat(4,"Borrow a toolbox","imports · pip · pandas · pyarrow · connectors")}
     ${beat(5,"Fail without losing your place","try/except/finally · Path · CLI arguments")}
   </div>`},
  {notes:"Run the four tiny files before opening config.py. The fourth is reconciliation: compare the same business totals on both sides and fail when they differ.",

 ]},
{id:"e4", code:"E4", color:"#60a5fa", title:"Python carries only what changed", mins:"40 min",
 slides:[
  {notes:"'Snowflake cannot reach Postgres on my laptop. Python can.' Watch the bookmark. Rows to its left are already copied. Rows to its right are this run.",
   html:`<div class="kicker in">Episode 4 · before the terminal</div><h2 class="in">A bookmark, not a <span class="grad">full copy</span></h2><p class="lead in">The watermark is the newest updated_at already delivered. This run reads after it, and stops 10 seconds ago so a late commit is not skipped.</p>
   <div class="scene"><div class="card track"><div class="band">
     <div class="flag"><b>watermark</b></div>
     ${[["09:00","copied",""],["09:04","copied",""],["09:11","copied",""],["09:40","this run","new"],["09:44","this run","new"]].map(r=>`<div class="trow"><span>${r[0]}</span><div class="rail"><i class="${r[2]}"></i></div><span>${r[1]}</span></div>`).join("")}
   </div></div></div>`},
  {notes:"Five steps, in order. 'If it crashes after the copy and before the bookmark moves, the next run loads those files again. Bronze can hold a duplicate. Silver keeps the newest.'",
   html:`<div class="kicker">One table, five steps</div><h2>Read, parcel, deliver, <span class="grad">then move the bookmark</span></h2><div class="beats focus">
     ${beat(1,"Read Postgres","Only rows newer than the bookmark.")}
     ${beat(2,"Python writes Parquet files","Parquet is a file format, not a language and not an IDE. pyarrow creates the files. You read the Python in Cursor.")}
     ${beat(3,"PUT and COPY","Files land in a Snowflake stage, then in the raw table.")}
     ${beat(4,"Move the bookmark","Only after the copy succeeds. Crash before that and the next run simply tries again.")}
     ${beat(5,"Deletes ride along","cdc.deleted_records is copied like any other table. dbt applies them later.")}
   </div>`},
  {notes:"Currencies first, five rows. Only then the full load. Do not paste .env into the terminal.",
   html:`<div class="kicker">Hands on</div><h2>One tiny table, <span class="grad">then everything</span></h2>
   ${hand(LOGO.py,"Terminal · project folder · .env loaded, not pasted","Terminal","python 02_ingestion_python/pg_to_snowflake.py --tables ref.currencies -v")}`}
]},
{id:"e5", code:"E5", color:"#ff7a5c", title:"dbt cleans the inbox", mins:"45 min",
 slides:[
  {notes:"'dbt never touches Postgres. It sends SQL to Snowflake.' Point at the pulsing row: that is the one silver keeps.",
   html:`<div class="kicker in">Episode 5 · before dbt</div><h2 class="in">Four copies arrive. <span class="grad">One row leaves.</span></h2><p class="lead in">Staging casts the VARIANT into columns and keeps the newest updated_at per id.</p>
   <div class="scene"><div class="copies">
     <div class="card copy"><span>{"id":101,"status":"PENDING"}</span><em>09:00</em></div>
     <div class="card copy"><span>{"id":101,"status":"POSTED","amount":2400}</span><em>09:05</em></div>
     <div class="card copy keep"><span>{"id":101,"status":"POSTED","amount":2400}</span><em>10:00 · kept</em><i class="ring"></i></div>
     <div class="card copy"><span>id 101 is in the delete log</span><em>dropped</em></div>
   </div></div>`},
  {notes:"Dev writes to DBT_FK_* so practice cannot overwrite production. Dev also keeps 30 days of transactions, not five million.",
   html:`<div class="kicker">What we will build</div><h2>Folders are the <span class="grad">floors</span></h2><div class="beats focus">
     ${beat(1,"staging","Views. Rename, cast, newest row, drop deletes. No joins between business tables.")}
     ${beat(2,"intermediate","Reusable logic: the day's FX rate, the primary account holder.")}
     ${beat(3,"snapshots","A camera. When a customer changes, the old version is kept with its dates.")}
     ${beat(4,"Dev is a sandbox","Target dev writes DBT_FK_ schemas and only 30 days of payments.")}
   </div>`},
  {notes:"dbt deps once, then build on dev. We are not on prod yet.",
   html:`<div class="kicker">Hands on</div><h2>Build it where it <span class="grad">cannot hurt prod</span></h2>
   ${hand(LOGO.dbt,"Terminal · 04_dbt_meridian_dw","dbt, target dev","dbt deps && dbt build --target dev")}`}
]},
{id:"e6", code:"E6", color:"#ff7a5c", title:"The star schema, for real", mins:"50 min",
 slides:[
  {notes:"'dbt already knows this order, from ref(). Watch the light. We build bottom-up: dates and rates, then dimensions, then the fact.'",
   html:`<div class="kicker in">Episode 6 · before the prod build</div><h2 class="in">The order is <span class="grad">not a guess</span></h2>
   <div class="scene" style="position:relative"><div class="light"></div><div class="cascade">
     ${[["1","dim_date, fx rates","no parents"],["2","dim_customer from the snapshot","versions, with dates"],["3","int_transactions_with_fx","rupees, dollars, that day's rate"],["4","fct_transactions","keys, not names"],["5","tests","the build fails if a key points nowhere"]].map(s=>`<div class="card step"><span class="n">${s[0]}</span><b>${s[1]}</b><span style="color:var(--faint)">${s[2]}</span></div>`).join("")}
   </div></div>`},
  {notes:"Deletes are a separate step. A missing key is a failed test, not a silent blank.",
   html:`<div class="kicker">Three things to show</div><h2>Join, history, <span class="grad">then prove it</span></h2><div class="beats focus">
     ${beat(1,"The fact stores keys","customer_key, not the customer's name. The name lives on the dimension, for that date.")}
     ${beat(2,"Deletes have their own step","The delete log removes rows silver would otherwise keep forever.")}
     ${beat(3,"Reconcile after the build","Warehouse totals against the bank, by day and currency.")}
   </div>`},
  {notes:"Prod build, then the reconcile script. This is the first time we write gold for real.",
   html:`<div class="kicker">Hands on</div><h2>Production, <span class="grad">then the two totals</span></h2>
   ${hand(LOGO.dbt,"Terminal · 04_dbt_meridian_dw · target prod","dbt, target prod","dbt build --target prod")}`}
]},
{id:"e7", code:"E7", color:"#38bdf8", title:"Airflow is the alarm clock", mins:"30 min",
 slides:[
  {notes:"'Airflow moves no data. It runs the commands we already ran by hand, on a timer, and retries.' The hand is the 5-minute DAG.",
   html:`<div class="kicker in">Episode 7 · before the Airflow UI</div><h2 class="in">The same commands. <span class="grad">A clock instead of us.</span></h2>
   <div class="scene"><div class="clockwrap"><div class="clock"><div class="hand"></div>${[0,30,60,90,120,150,180,210,240,270,300,330].map(d=>`<i class="tick" style="transform:rotate(${d}deg)"></i>`).join("")}</div>
   <div class="jobs">
     <div class="card job"><div class="tile">${LOGO.af}</div><div><b>Every 5 minutes</b><p class="lead" style="font-size:16px">Load what changed, then the fast dbt models. Freshness under 15 minutes or the run fails.</p></div></div>
     <div class="card job"><div class="tile">${LOGO.af}</div><div><b>Every night</b><p class="lead" style="font-size:16px">Snapshots, marts, the completeness check, docs.</p></div></div>
     <div class="card job"><div class="tile">${LOGO.af}</div><div><b>If a task dies</b><p class="lead" style="font-size:16px">Retry, then one JSON line in the log. Slack only if a webhook is set.</p></div></div>
   </div></div></div>`},
  {notes:"The stuck-run story: the DAG said running for 20 minutes because the pool did not exist. Read the task, not the DAG.",
   html:`<div class="kicker">What we will do</div><h2>Copy in, start, <span class="grad">create the pool</span></h2><div class="beats focus">
     ${beat(1,"The container cannot see the Mac","Copy dbt, the loader and the key into include/. PG_HOST becomes host.docker.internal.")}
     ${beat(2,"astro dev start","Scheduler, workers, the UI. Open the URL it prints, not localhost:8080.")}
     ${beat(3,"Create the pool","Without meridian_postgres, tasks wait forever and the DAG still says running.")}
     ${beat(4,"One green 5-minute run, then trigger the daily","Unpause meridian_microbatch_ingest. Trigger meridian_daily_batch once.")}
   </div>`},
  {notes:"Do not run astro dev init. It would overwrite the Dockerfile and the DAGs.",
   html:`<div class="kicker">Hands on</div><h2>Start the clock. <span class="grad">Don't re-init the project.</span></h2>
   ${hand(LOGO.af,"Terminal · 05_airflow","the Airflow folder","astro dev start")}`}
]},
{id:"e8", code:"E8", color:"#fbbf24", title:"Break it, measure, fix", mins:"45 min",
 slides:[
  {notes:"'Every lab is the same four beats. Two numbers, side by side. We change one thing.' The red bar is the before.",
   html:`<div class="kicker in">Episode 8 · before the lab</div><h2 class="in">Break it. Measure. <span class="grad">Fix one thing.</span> Measure.</h2>
   <div class="scene"><div class="ba">
     <div class="card side"><h3 style="color:#fb7185">Before</h3><p class="lead">Postgres reads every row to find the new ones.</p><div class="meter bad"><b style="--w:92%"></b></div><p class="mono" style="color:var(--faint)">Seq Scan · seconds</p></div>
     <div class="card side"><h3 style="color:#2dd4bf">After</h3><p class="lead">An index on updated_at. Same question.</p><div class="meter good"><b></b></div><p class="mono" style="color:var(--faint)">Index Scan · milliseconds</p></div>
   </div></div>`},
  {notes:"Name all four labs. The cache one is the trap: the second run looks faster because Snowflake remembered the answer.",
   html:`<div class="kicker">Four labs, one habit</div><h2>The number has to <span class="grad">move for a reason</span></h2><div class="beats focus">
     ${beat(1,"Missing index","The courier's question, with and without an index. Read EXPLAIN.")}
     ${beat(2,"Pruning","Random load order makes every file hold every date. Order or cluster by date.")}
     ${beat(3,"A sort that spills","Rewrite the query first. A bigger warehouse is the second experiment.")}
     ${beat(4,"The second run is a liar","Turn USE_CACHED_RESULT off before claiming anything got faster.")}
   </div>`},
  {notes:"These scripts build big tables. The 100-million-row one should be recorded ahead, and dropped after.",
   html:`<div class="kicker">Hands on</div><h2>One script, <span class="grad">two measurements</span></h2>
   ${hand(LOGO.sf,"DBeaver and Snowsight · 06_performance_lab","the lab folder","01_postgres_missing_index.sql")}`}
]},
{id:"e9", code:"E9", color:"#4ade80", title:"Quality, CI, cost, runbook", mins:"30 min",
 slides:[
  {notes:"'A green build means the SQL ran. It does not mean the numbers match the bank, or that the data is fresh, or that we can afford it.'",
   html:`<div class="kicker in">Episode 9 · before the checks</div><h2 class="in">Green is the first check, <span class="grad">not the last</span></h2>
   <div class="scene"><div class="lights">
     ${[["Tests","Every key, every relationship, every run"],["Reconcile","Warehouse totals against the bank, by day"],["Freshness","Behind by more than 15 minutes and the run fails"],["Completeness","Every bronze key is in staging. Nightly, not every 5 minutes"],["CI","A pull request builds only what changed"],["Cost","Which warehouse, which query, which credits"]].map((x,i)=>`<div class="card lightcard"><i class="dot" style="animation-delay:-${i*0.4}s"></i><div><b>${x[0]}</b><p class="lead" style="font-size:16px">${x[1]}</p></div></div>`).join("")}
   </div></div>`},
  {notes:"Reconciliation is a balance scale across systems. Both queries use the same complete dates and grouping. The outer join is important: an inner join would hide a group missing entirely from one side.",
   html:`<div class="kicker">Reconciliation</div><h2>Ask both systems the <span class="grad">same business question</span></h2><div class="beats focus">
     ${beat(1,"Postgres source truth","Count all rows and sum POSTED amount by UTC date and currency or branch. Ignore the newest two minutes.")}
     ${beat(2,"Snowflake warehouse truth","Ask fct_transactions at exactly the same grain.")}
     ${beat(3,"Outer join the answers","A missing group remains visible; row_diff and amount_diff explain the gap.")}
     ${beat(4,"Persist and fail","Write RECONCILIATION_RUNS. Zero mismatched groups passes; any mismatch exits 1 and becomes an incident.")}
   </div>`},
  {notes:"Open the runbook on camera and read one incident: a table that stopped moving.",
   html:`<div class="kicker">What we will open</div><h2>When it breaks <span class="grad">at 2 a.m.</span></h2><div class="beats focus">
     ${beat(1,"The runbook","What to check, what bad looks like, what to do. One incident, out loud.")}
     ${beat(2,"Bounded replay","Re-copy one time window without moving the watermark.")}
     ${beat(3,"The pull request","GitHub Actions: tests, secret scan, and dbt only for changed models.")}
   </div>`},
  {notes:"The runbook is a markdown file. Show it, don't perform a fake outage unless you mean to.",
   html:`<div class="kicker">Hands on</div><h2>Read one page of the <span class="grad">runbook</span></h2>
   ${hand(LOGO.gh,"00_architecture/OPERATIONS_RUNBOOK.md","the runbook","one incident, start to finish")}`}
]},
{id:"e10", code:"E10", color:"#fbbf24", title:"Cards: score, then offer", mins:"40 min",
 slides:[
  {notes:"'Features come from gold. Python trains. Scores land in bronze, like any other feed. dbt brings them back to gold. Nothing writes to the bank.' Watch the needle. The amber line is 0.70.",
   html:`<div class="kicker in">Episode 10 · before training</div><h2 class="in">Below the line, <span class="grad">no scores are written</span></h2><p class="lead in">Holdout AUC under 0.70: the run is REJECTED and offers fall back to rules. The amber mark is the gate.</p>
   <div class="scene"><div class="gauge"><div class="dial"></div><div class="gate"></div><div class="needle"></div><div class="g-label">0.50 coin toss · <b style="color:var(--amber)">0.70 gate</b> · 1.00 certain</div></div></div>`},
  {notes:"Four models: decide an application, guess who would be approved, score one swipe, and block an offer to someone under suspicion.",
   html:`<div class="kicker">The loop</div><h2>Gold, train, bronze, <span class="grad">gold again</span></h2><div class="beats focus">
     ${beat(1,"Features from gold","ml_customer_features. The model never reads the live bank.")}
     ${beat(2,"Train on older days, test on the newest","The gate uses days the model did not see.")}
     ${beat(3,"Scores are a feed","RAW.ML.MODEL_SCORES, with a row in MODEL_RUNS: SUCCEEDED or REJECTED.")}
     ${beat(4,"dbt publishes the offer","fct_next_best_offer. score_source is MODEL or RULE.")}
   </div>`},
  {notes:"Then the query that groups offers by score_source. We want a MODEL row.",
   html:`<div class="kicker">Hands on</div><h2>Train, publish, <span class="grad">count the offers</span></h2>
   ${hand(LOGO.py,"Terminal, then Snowsight","Python, then dbt","python 09_decisioning_python/train_and_score.py")}`}
]},
{id:"e11", code:"E11", color:"#a78bfa", title:"Ask in English", mins:"45 min",
 slides:[
  {notes:"Walk the token. 'The model writes SQL. Snowflake runs it as the person who signed in. The model never sees the hidden rows.'",

{id:"e12", code:"E12", color:"#a8a29e", title:"The rules survive a rebuild", mins:"45 min",
 slides:[
  {notes:"'dbt can hang the lock on the door after every rebuild. Only security changes what the lock allows.'",
   html:`<div class="kicker in">Episode 12 · before we break a contract</div><h2 class="in">One owner <span class="grad">per kind of thing</span></h2>
   <div class="scene"><div class="owners">
     <div class="card owner"><div class="tag" style="color:var(--amber)">SECURITY</div><h3>Writes the rule</h3><p class="lead">Policies, masks, who is allowed in. An engineer does not edit these.</p></div>
     <div class="lock">🔒</div>
     <div class="card owner"><div class="tag sv">DBT</div><h3>Hangs it back up</h3><p class="lead">A rebuild would drop the lock. dbt re-attaches the same policy to the new table.</p></div>
   </div></div>`},
  {notes:"Rename a column on dim_branch, build, read the refusal, rename it back. That is the contract.",
   html:`<div class="kicker">What we will prove</div><h2>A contract <span class="grad">fails the build</span></h2><div class="beats focus">
     ${beat(1,"dim_branch lists every column and type","Rename one. The build refuses. Put the name back.")}
     ${beat(2,"Loader owns raw. dbt owns analytics.","Terraform owns warehouses, roles and databases.")}
     ${beat(3,"ACCESS_HISTORY","Which user read which columns. It can lag a few hours.")}
   </div>`},
  {notes:"Dev target, one model. We are trying to make it fail, then we undo it.",
   html:`<div class="kicker">Hands on</div><h2>Break it on purpose. <span class="grad">On dev.</span></h2>
   ${hand(LOGO.dbt,"Terminal · 04_dbt_meridian_dw","dbt, one model","dbt build -s dim_branch --target dev")}`}

 slides:[

   html:`<div class="kicker in">Episode 13 · the pitch</div><h2 class="in" style="display:flex;align-items:center;gap:24px">Four beats. <span class="grad">Two minutes.</span><span class="timer" style="--p:70%"><span>2:00</span></span></h2>

const home = document.getElementById("home");
const slidesRoot = document.getElementById("slides");
const notes = document.getElementById("notes");
home.innerHTML = `<div class="kicker">Choose a lesson</div>
  <h1>See the picture, <span class="grad">then build it</span></h1>
  <p class="lead">Use the arrow keys to move through a lesson. Medallion is the short opening of Episode 1, immediately before PostgreSQL.</p>
  <div class="grid">${EP.map(e=>`<button class="card pick" style="--c:${e.color}" data-ep="${e.id}"><em>${e.code} · ${e.mins}</em><b>${e.title}</b><span>${e.slides.length} scenes</span></button>`).join("")}</div>`;

let slides = [], index = 0, step = 0, current = null;
const fragsOf = s => [...s.querySelectorAll(".f")];

function fit(){ document.getElementById("stage").style.transform = `translate(-50%,-50%) scale(${Math.min(innerWidth/1600, innerHeight/900)})`; }

function paint(){
  slides.forEach((s,k)=>{ s.classList.toggle("active", k===index); s.classList.toggle("past", k<index); });
  const s = slides[index]; if(!s) return;
  const fr = fragsOf(s);
  fr.forEach((el,k)=>{ el.classList.toggle("on", k<step); el.classList.toggle("cur", k===step-1); });
  document.getElementById("count").textContent = `${current.code}  ${String(index+1).padStart(2,"0")} / ${slides.length}`;
  document.getElementById("progress").style.width = `${((index + (fr.length ? step/fr.length : 1)) / slides.length) * 100}%`;
  notes.textContent = `${current.code} · slide ${index+1}${fr.length?` · click ${step}/${fr.length}`:""}\n\n${s.dataset.notes||""}`;
  history.replaceState(null, "", `#${current.id}-${index}${step ? "." + step : ""}`);
}

function goTo(k, atEnd){
  index = Math.max(0, Math.min(slides.length-1, k));
  const s = slides[index];
  step = atEnd ? fragsOf(s).length : 0;
  s.querySelectorAll(".in").forEach(el=>{ el.style.animation="none"; void el.offsetWidth; el.style.animation=""; });
  paint();
}
function next(){
  const fr=fragsOf(slides[index]);
  if(step<fr.length){ step++; paint(); }
  else if(index<slides.length-1) goTo(index+1);
  else if(window.parent!==window) window.parent.postMessage({type:"meridian-complete",section:"walkthrough",episode:current.id},"*");
}
function prev(){ if(step>0){step--;paint()} else if(index>0) goTo(index-1, true); }

function openEp(id, at){
  current = EP.find(e=>e.id===id); if(!current) return;
  document.documentElement.style.setProperty("--accent", current.color);
  home.style.display="none"; slidesRoot.style.display="block";
  slidesRoot.innerHTML = current.slides.map(sl=>`<section class="slide" style="--accent:${current.color}" data-notes="${sl.notes.replace(/"/g,'&quot;')}">${sl.html}</section>`).join("");
  slides = [...slidesRoot.querySelectorAll(".slide")];
  const [slideNo, clickNo] = String(at||"0").split(".").map(Number);
  goTo(Number.isFinite(slideNo)?slideNo:0);
  if(clickNo>0){ step=Math.min(clickNo, fragsOf(slides[index]).length); paint(); }
}
function showHome(){
  if(window.parent!==window){
    window.parent.postMessage({type:"meridian-home"},"*");
    return;
  }
  current=null; home.style.display="flex"; slidesRoot.style.display="none"; slides=[];
  document.getElementById("count").textContent="pick an episode";
  document.getElementById("progress").style.width="0";
  notes.textContent="Pick an episode. This plays before you open Docker, DBeaver, Snowsight or the terminal.";
  history.replaceState(null,"","#");
}
home.addEventListener("click", e=>{ const b=e.target.closest("[data-ep]"); if(b) openEp(b.dataset.ep); });
addEventListener("keydown", e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if(!current){ if(k==="Escape") return; }
  if(["ArrowRight","PageDown"," ","Enter"].includes(k)){ if(current){e.preventDefault();next()} }
  else if(["ArrowLeft","PageUp","Backspace"].includes(k)){ if(current){e.preventDefault();prev()} }
  else if(k==="Escape") showHome();
  else if(k==="ArrowDown" && current) goTo(index+1);
  else if(k==="ArrowUp" && current) goTo(index-1);
  else if(k==="f"||k==="F") document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  else if(k==="n"||k==="N") document.body.classList.toggle("show-notes");
  else if(k==="c"||k==="C") document.body.classList.toggle("clean");
  else if(k==="h"||k==="H"||k==="?") document.body.classList.toggle("show-help");
});
addEventListener("resize", fit); fit();

(function ambient(){
  const c=document.getElementById("fx"), x=c.getContext("2d");
  const dots=Array.from({length:42},()=>({x:Math.random()*1600,y:Math.random()*900,r:1.1+Math.random()*1.8,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,a:.18+Math.random()*.4}));
  (function frame(){
    x.clearRect(0,0,1600,900);
    dots.forEach((d,i)=>{
      d.x+=d.vx; d.y+=d.vy; if(d.x<0||d.x>1600)d.vx*=-1; if(d.y<0||d.y>900)d.vy*=-1;
      x.fillStyle=`rgba(186,224,255,${d.a})`; x.beginPath(); x.arc(d.x,d.y,d.r,0,7); x.fill();
      for(let j=i+1;j<dots.length;j++){ const e=dots[j], dist=Math.hypot(d.x-e.x,d.y-e.y);
        if(dist<150){ x.strokeStyle=`rgba(125,211,252,${(1-dist/150)*.16})`; x.beginPath(); x.moveTo(d.x,d.y); x.lineTo(e.x,e.y); x.stroke(); } }
    });
    requestAnimationFrame(frame);
  })();
})();

function fromHash(){
  const m = location.hash.slice(1).match(/^([a-z0-9]+)(?:-(\d+))?(?:\.(\d+))?$/);
  if(m && EP.some(e => e.id === m[1])) openEp(m[1], `${m[2] || 0}.${m[3] || 0}`);
  else showHome();
}
addEventListener("hashchange", fromHash);
fromHash();
</script>
